<section aria-labelledby="lista-titulo">
  <!--   <div class="encabezado-seccion">
    <h2 id="lista-titulo">Actividades recientes</h2>
    <p>{{ actividades.length }} en la vista</p>
  </div> -->

  <ul class="lista">
    @for (actividad of actividades(); track actividad.id) {
    <li>
      <app-tarjeta-actividad [actividad]="actividad" [seleccionada]="seleccionadaId() === actividad.id"
        (seleccionCambiada)="seleccionCambiada.emit($event)" (destacadoCambiado)="destacadoCambiado.emit($event)"
        (avanceSolicitado)="avanceSolicitado.emit($event)"
        (eliminacionSolicitada)="eliminacionSolicitada.emit($event)" />

      <a class="enlace-detalle" [routerLink]="['/actividades', actividad.id]">
        Ver detalle de {{ actividad.titulo }}
      </a>
    </li>
    } @empty {
    <li class="vacio">
      <p>{{ mensajeVacio() }}</p>
      @if (hayFiltros()) {
      <button type="button" (click)="limpiezaSolicitada.emit()">Quitar los filtros</button>
      }
    </li>
    }
  </ul>
</section>
